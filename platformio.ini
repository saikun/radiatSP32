; PlatformIO Project Configuration File
;
; ビルドモードは環境 (env) で切り替える:
;   radiation     : 放射線検出モード      (src/radiation/)      pio run -e radiation -t upload
;   camera_stream : カメラストリームモード (src/camera_stream/)  pio run -e camera_stream -t upload
; VSCode では下部ステータスバーの環境選択 (env:...) から切り替えられる。
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = radiation

; ---- 全モード共通設定 ----
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 (16MB Quad Flash + 8MB Octal PSRAM) 専用のハードウェア定義 ---
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- UART通信速度（ファームウェアとシリアルモニタで共通） ---
custom_stream_baud = 921600

; --- ビルドフラグ（PSRAM有効化・最適化・USBシリアル設定） ---
; SerialをUARTブリッジ側USBポートへ出すため CDC_ON_BOOT は 0
build_flags =
    -DBOARD_HAS_PSRAM
    -O3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSTREAM_BAUD=${this.custom_stream_baud}

; --- シリアルモニタ設定 ---
monitor_speed = ${this.custom_stream_baud}
monitor_filters = esp32_exception_decoder

; ---- 放射線検出モード (tools/radiat_viewer.py) ----
[env:radiation]
build_src_filter = +<radiation/>
; RADIATION_USE_TFT=0 にすると ST7789 の制御を丸ごと外す (未接続のままでも 1 で動作する)
build_flags =
    ${env.build_flags}
    -DRADIATION_USE_TFT=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; ---- カメラストリームモード (tools/camera_viewer.py) ----
[env:camera_stream]
build_src_filter = +<camera_stream/>
